<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Huarong Dao (Klotski) — 華容道</title>
  <style>
    :root {
      --bg: #1c1917;
      --board-bg: #292524;
      --border: #d6d3d1;
      --caocao: #dc2626;
      --guanyu: #d97706;
      --general: #2563eb;
      --soldier: #059669;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      background: radial-gradient(circle at center, #78350f 0%, #291507 100%);
      color: #fef3c7;
      font-family: "PingFang TC", "Noto Sans TC", "SF Mono", sans-serif;
      padding: 12px 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.3rem, 2.2vw, 1.85rem);
      color: #fde047;
      text-shadow: 0 2px 4px rgba(0,0,0,0.6);
      letter-spacing: 2px;
    }
    .hud {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: clamp(0.95rem, 1.3vw, 1.15rem);
    }
    button {
      background: #ea580c;
      color: #fff;
      border: 2px solid #431407;
      border-radius: 8px;
      padding: 6px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 0 #431407;
    }
    button:hover { background: #c2410c; }
    .frame {
      position: relative;
      padding: 14px;
      background: #451a03;
      border: 8px double #fbbf24;
      border-radius: 12px;
      box-shadow: 0 18px 44px rgba(0, 0, 0, 0.7);
    }
    /* Exit opening at the bottom center (╠═══════            ═══════╣) */
    .frame::after {
      content: "EXIT 出口";
      position: absolute;
      bottom: -8px;
      left: 50%;
      transform: translateX(-50%);
      width: 50%;
      height: 14px;
      background: #291507;
      color: #fde047;
      font-size: 12px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 3px;
    }
    #board {
      position: relative;
      background: #271206;
    }
    .piece {
      position: absolute;
      border: 2.5px solid rgba(255, 251, 235, 0.85);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: clamp(1.3rem, 2.5vh, 2.1rem);
      color: #fff;
      cursor: grab;
      user-select: none;
      transition: left 0.14s ease, top 0.14s ease, box-shadow 0.14s ease;
      box-shadow: inset 0 3px 6px rgba(255,255,255,0.3), 0 5px 12px rgba(0,0,0,0.5);
      text-shadow: 0 2px 3px rgba(0,0,0,0.5);
    }
    .piece:active { cursor: grabbing; }
    .piece.selected {
      outline: 4px solid #fde047;
      z-index: 5;
    }
    .piece.caocao { background: linear-gradient(135deg, #ef4444, #b91c1c); font-size: clamp(1.7rem, 3.3vh, 2.8rem); letter-spacing: 8px; }
    .piece.guanyu { background: linear-gradient(135deg, #f59e0b, #b45309); letter-spacing: 8px; }
    .piece.general {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      writing-mode: vertical-rl;
      text-orientation: upright;
      letter-spacing: 10px;
    }
    .piece.soldier { background: linear-gradient(135deg, #10b981, #047857); }
    .hint {
      font-size: clamp(0.9rem, 1.2vw, 1.1rem);
      color: #fde68a;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>Huarong Dao (Klotski) — 華容道</h1>
  <div class="hud">
    <span>Moves: <strong id="moves">0</strong></span>
    <button id="resetBtn">Reset Board</button>
    <button id="soundBtn">🔊 音效開</button>
  </div>

  <div class="frame">
    <div id="board"></div>
  </div>

  <div class="hint" id="status">
    Click or drag any block (or select a block and press Arrow Keys / WASD) to slide it.
  </div>

  <script>
    // --- Web Audio API Classical Pentatonic & Wooden Block Sound Engine ---
    let audioCtx = null;
    let soundEnabled = true;
    let bgmTimer = null;
    let bgmIdx = 0;
    // Pentatonic scale (宮商角徵羽)
    const PENTATONIC = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25, 440.00, 392.00, 329.63, 293.66];

    function getAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (!bgmTimer && soundEnabled) {
        bgmTimer = setInterval(() => {
          if (!soundEnabled) return;
          playTone(PENTATONIC[bgmIdx % PENTATONIC.length], "sine", 0.28, 0, 0.03);
          bgmIdx++;
        }, 360);
      }
      return audioCtx;
    }

    function playTone(freq, type = "sine", duration = 0.1, delay = 0, vol = 0.15, slideTo = null) {
      if (!soundEnabled) return;
      const ctx = getAudio();
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration);
    }

    const sfx = {
      tap()   { playTone(260, "triangle", 0.04, 0, 0.14, 180); },
      slide() { playTone(190, "triangle", 0.09, 0, 0.24, 310); },
      win()   { [261.63, 329.63, 392.00, 523.25, 659.25].forEach((f, i) => playTone(f, "triangle", 0.22, i * 0.12, 0.22)); }
    };

    let CELL = 100;
    const GAP = 6;

    function updateCellSize() {
      const availW = window.innerWidth - 80;
      const availH = window.innerHeight - 170;
      CELL = Math.max(64, Math.floor(Math.min(availW / 4, availH / 5)));
      const board = document.getElementById("board");
      board.style.width = `${CELL * 4}px`;
      board.style.height = `${CELL * 5}px`;
    }

    // Exact "Heng Dao Li Ma" (橫刀立馬) layout from huarondao.md
    const INITIAL_PIECES = [
      { id: "machao",   name: "馬超", x: 0, y: 0, w: 1, h: 2, type: "general" },
      { id: "caocao",   name: "曹操", x: 1, y: 0, w: 2, h: 2, type: "caocao" },
      { id: "huang",    name: "黃忠", x: 3, y: 0, w: 1, h: 2, type: "general" },
      { id: "zhaoyun",  name: "趙雲", x: 0, y: 2, w: 1, h: 2, type: "general" },
      { id: "guanyu",   name: "關羽", x: 1, y: 2, w: 2, h: 1, type: "guanyu" },
      { id: "zhangfei", name: "張飛", x: 3, y: 2, w: 1, h: 2, type: "general" },
      { id: "zu1",      name: "卒",   x: 1, y: 3, w: 1, h: 1, type: "soldier" },
      { id: "zu2",      name: "卒",   x: 2, y: 3, w: 1, h: 1, type: "soldier" },
      { id: "zu3",      name: "卒",   x: 0, y: 4, w: 1, h: 1, type: "soldier" },
      { id: "zu4",      name: "卒",   x: 3, y: 4, w: 1, h: 1, type: "soldier" }
    ];

    let pieces = [];
    let selectedId = "zu1";
    let moves = 0;
    let dragStart = null;

    function initGame() {
      updateCellSize();
      pieces = INITIAL_PIECES.map(p => ({ ...p }));
      moves = 0;
      document.getElementById("status").textContent =
        "Click or drag any block (or select a block and press Arrow Keys / WASD) to slide it.";
      render();
    }

    window.addEventListener("resize", () => {
      updateCellSize();
      render();
    });

    function canMove(piece, dx, dy) {
      const nx = piece.x + dx;
      const ny = piece.y + dy;
      if (nx < 0 || ny < 0 || nx + piece.w > 4 || ny + piece.h > 5) return false;

      for (const other of pieces) {
        if (other.id === piece.id) continue;
        const overlapX = nx < other.x + other.w && nx + piece.w > other.x;
        const overlapY = ny < other.y + other.h && ny + piece.h > other.y;
        if (overlapX && overlapY) return false;
      }
      return true;
    }

    function tryMove(piece, dx, dy) {
      if (!canMove(piece, dx, dy)) return false;
      piece.x += dx;
      piece.y += dy;
      moves++;
      sfx.slide();
      render();
      checkWin();
      return true;
    }

    function autoSlide(piece) {
      const dirs = [
        [0, 1], [0, -1], [-1, 0], [1, 0]
      ];
      const valid = dirs.filter(([dx, dy]) => canMove(piece, dx, dy));
      if (valid.length === 1) {
        tryMove(piece, valid[0][0], valid[0][1]);
      } else {
        sfx.tap();
      }
    }

    function checkWin() {
      const cc = pieces.find(p => p.id === "caocao");
      if (cc.x === 1 && cc.y === 3) {
        sfx.win();
        document.getElementById("status").textContent =
          `🎉 曹操成功脫逃！You solved Huarong Dao in ${moves} moves!`;
      }
    }

    function render() {
      const board = document.getElementById("board");
      board.innerHTML = "";
      document.getElementById("moves").textContent = moves;

      for (const p of pieces) {
        const el = document.createElement("div");
        el.className = `piece ${p.type}` + (p.id === selectedId ? " selected" : "");
        el.style.left = `${p.x * CELL + GAP / 2}px`;
        el.style.top = `${p.y * CELL + GAP / 2}px`;
        el.style.width = `${p.w * CELL - GAP}px`;
        el.style.height = `${p.h * CELL - GAP}px`;
        el.textContent = p.name;

        el.addEventListener("pointerdown", e => {
          selectedId = p.id;
          dragStart = { x: e.clientX, y: e.clientY, piece: p, moved: false };
          el.setPointerCapture(e.pointerId);
          render();
        });

        el.addEventListener("pointermove", e => {
          if (!dragStart || dragStart.piece.id !== p.id || dragStart.moved) return;
          const dx = e.clientX - dragStart.x;
          const dy = e.clientY - dragStart.y;
          if (Math.abs(dx) < 24 && Math.abs(dy) < 24) return;
          if (Math.abs(dx) > Math.abs(dy)) {
            if (tryMove(p, dx > 0 ? 1 : -1, 0)) dragStart.moved = true;
          } else {
            if (tryMove(p, 0, dy > 0 ? 1 : -1)) dragStart.moved = true;
          }
        });

        el.addEventListener("pointerup", () => {
          if (dragStart && !dragStart.moved) {
            autoSlide(p);
          }
          dragStart = null;
        });

        board.appendChild(el);
      }
    }

    window.addEventListener("keydown", e => {
      const p = pieces.find(x => x.id === selectedId);
      if (!p) return;
      const k = e.key.toLowerCase();
      if (["arrowup", "w"].includes(k)) { e.preventDefault(); tryMove(p, 0, -1); }
      else if (["arrowdown", "s"].includes(k)) { e.preventDefault(); tryMove(p, 0, 1); }
      else if (["arrowleft", "a"].includes(k)) { e.preventDefault(); tryMove(p, -1, 0); }
      else if (["arrowright", "d"].includes(k)) { e.preventDefault(); tryMove(p, 1, 0); }
    });

    document.getElementById("resetBtn").addEventListener("click", initGame);
    document.getElementById("soundBtn").addEventListener("click", e => {
      soundEnabled = !soundEnabled;
      e.target.textContent = soundEnabled ? "🔊 音效開" : "🔇 靜音";
    });
    initGame();
  </script>
</body>
</html>
