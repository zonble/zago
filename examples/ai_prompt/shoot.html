<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Side-Scrolling Shoot 'Em Up — JET vs BOSS</title>
  <style>
    :root {
      --bg: #0b0e14;
      --border: #d4d4d8;
      --earth: #78350f;
      --earth-edge: #b45309;
      --jet: #38bdf8;
      --enemy: #f43f5e;
      --canon: #f59e0b;
      --boss: #a855f7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: #f4f4f5;
      font-family: "SF Mono", "Menlo", "Monaco", monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      user-select: none;
    }
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }
    h1 {
      margin: 0;
      font-size: clamp(1.1rem, 1.6vw, 1.5rem);
      color: #38bdf8;
      letter-spacing: 1px;
    }
    .hud-bar {
      display: flex;
      gap: 20px;
      align-items: center;
      font-size: clamp(0.85rem, 1.1vw, 1.05rem);
    }
    #game {
      width: 100%;
      flex: 1;
      min-height: 0;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: radial-gradient(ellipse at center, #111827 0%, #090d16 100%);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.7);
      display: block;
    }
    .minimap-label {
      width: 100%;
      margin-top: 8px;
      margin-bottom: 4px;
      font-size: 0.8rem;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
    }
    #minimap {
      width: 100%;
      height: 76px;
      border: 1px solid #52525b;
      border-radius: 4px;
      background: #090d16;
      display: block;
    }
    button {
      background: #27272a;
      color: #fff;
      border: 1px solid #71717a;
      border-radius: 4px;
      padding: 5px 14px;
      font-family: inherit;
      cursor: pointer;
    }
    button:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <div class="top-bar">
    <h1>Side-Scrolling Shoot 'Em Up (Gradius Style)</h1>
    <div class="hud-bar">
      <span>Controls: <strong>WASD / Arrow Keys</strong> to fly, <strong>Space</strong> to shoot</span>
      <span>Score: <strong id="scoreEl">0</strong></span>
      <button id="soundBtn">🔊 Sound: ON</button>
      <button id="restartBtn">Restart (R)</button>
    </div>
  </div>

  <!-- Main Screen Viewport -->
  <canvas id="game" width="840" height="450"></canvas>

  <!-- Full Stage Map Progress Preview -->
  <div class="minimap-label">
    <span>STAGE MAP PROGRESS (Directly parsed from shoot.md)</span>
    <span id="stageStatus">Scrolling Cavern...</span>
  </div>
  <canvas id="minimap" width="840" height="81"></canvas>

  <script>
    // --- Web Audio API Cosmic Space Synth & Sound Engine ---
    let audioCtx = null;
    let spaceBus = null;
    let soundEnabled = true;
    let bgmTimer = null;
    let bgmStep = 0;

    // Cosmic Lydian / Minor Space Arpeggio (E minor 9 -> C Lydian #11 -> A minor 9 -> B Phrygian)
    const SPACE_ARP = [
      659.25, 783.99, 987.77, 1174.66, 1479.98, 1174.66, 987.77, 783.99,
      659.25, 783.99, 987.77, 1174.66, 1318.51, 1174.66, 987.77, 783.99,
      523.25, 659.25, 783.99, 987.77,  1174.66, 987.77,  783.99, 659.25,
      587.33, 739.99, 880.00, 1174.66, 1479.98, 1174.66, 880.00, 739.99
    ];
    const SPACE_PAD_CHORDS = [
      [164.81, 246.94, 329.63, 369.99], // Em9 cosmic drone
      [130.81, 196.00, 293.66, 369.99], // Cmaj9(#11) Lydian space chord
      [110.00, 164.81, 246.94, 261.63], // Am9 nebula chord
      [123.47, 185.00, 246.94, 311.13]  // B7alt dark star chord
    ];
    const SPACE_BASS = [
      82.41, 82.41, 164.81, 82.41, 65.41, 65.41, 130.81, 65.41,
      55.00, 55.00, 110.00, 55.00, 61.74, 61.74, 123.47, 73.42
    ];

    // Dark Sci-Fi Boss Sequence (Phrygian Dominant / Diminished cosmic tension)
    const BOSS_ARP = [
      659.25, 698.46, 830.61, 987.77, 1318.51, 987.77, 830.61, 698.46,
      659.25, 783.99, 932.33, 1108.73, 1396.91, 1108.73, 932.33, 783.99
    ];
    const BOSS_BASS = [
      82.41, 164.81, 87.31, 164.81, 98.00, 196.00, 92.50, 185.00
    ];

    function initSpaceBus(ctx) {
      if (spaceBus) return spaceBus;
      // Master resonant filter + Stereo-like Cosmic Delay Echo loop
      const filter = ctx.createBiquadFilter();
      filter.type = "lowpass";
      filter.frequency.value = 1800;
      filter.Q.value = 3.5;

      const delay = ctx.createDelay(1.0);
      delay.delayTime.value = 0.27;

      const feedback = ctx.createGain();
      feedback.gain.value = 0.45;

      const wet = ctx.createGain();
      wet.gain.value = 0.38;

      // Filter -> dry destination & -> delay loop -> wet destination
      filter.connect(ctx.destination);
      filter.connect(delay);
      delay.connect(feedback);
      feedback.connect(delay);
      delay.connect(wet);
      wet.connect(ctx.destination);

      spaceBus = { filter, delay, feedback, wet };
      return spaceBus;
    }

    function playSpaceArp(freq, duration = 0.22, vol = 0.045) {
      if (!soundEnabled || !audioCtx) return;
      const t0 = audioCtx.currentTime;
      const bus = initSpaceBus(audioCtx);

      // Slowly sweep the resonant low-pass filter for a cosmic synthesizer feel
      const sweep = 1100 + Math.sin(bgmStep * 0.15) * 800;
      bus.filter.frequency.setTargetAtTime(sweep, t0, 0.08);

      // Dual slightly-detuned oscillators for shimmering space chorus
      for (const detune of [-7, 7]) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = detune < 0 ? "triangle" : "sine";
        osc.frequency.setValueAtTime(freq, t0);
        osc.detune.setValueAtTime(detune, t0);

        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(vol, t0 + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0008, t0 + duration);

        osc.connect(gain);
        gain.connect(bus.filter);
        osc.start(t0);
        osc.stop(t0 + duration);
      }
    }

    function playSpacePad(chordFreqs, duration = 1.35, vol = 0.022) {
      if (!soundEnabled || !audioCtx) return;
      const t0 = audioCtx.currentTime;
      const bus = initSpaceBus(audioCtx);

      chordFreqs.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx % 2 === 0 ? "sawtooth" : "triangle";
        osc.frequency.setValueAtTime(freq, t0);
        osc.detune.setValueAtTime((idx - 1.5) * 6, t0);

        // Slow atmospheric swell attack & release
        gain.gain.setValueAtTime(0.001, t0);
        gain.gain.linearRampToValueAtTime(vol, t0 + duration * 0.45);
        gain.gain.exponentialRampToValueAtTime(0.0008, t0 + duration);

        osc.connect(gain);
        gain.connect(bus.filter);
        osc.start(t0);
        osc.stop(t0 + duration);
      });
    }

    function playSubBass(freq, duration = 0.24, vol = 0.075) {
      if (!soundEnabled || !audioCtx) return;
      const t0 = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const subFilter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(freq, t0);

      // Synth bass filter pluck envelope
      subFilter.type = "lowpass";
      subFilter.Q.value = 4.0;
      subFilter.frequency.setValueAtTime(650, t0);
      subFilter.frequency.exponentialRampToValueAtTime(130, t0 + duration);

      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);

      osc.connect(subFilter);
      subFilter.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(t0);
      osc.stop(t0 + duration);
    }

    function startBgmLoop() {
      if (bgmTimer) return;
      bgmTimer = setInterval(() => {
        if (!soundEnabled || !audioCtx || audioCtx.state !== "running" || gameOver || victory) return;
        const isBoss = (typeof cameraX !== "undefined" && typeof WORLD_W !== "undefined") &&
                       (cameraX >= WORLD_W - canvas.width - 120);
        if (isBoss) {
          playSpaceArp(BOSS_ARP[bgmStep % BOSS_ARP.length], 0.18, 0.05);
          if (bgmStep % 2 === 0) {
            playSubBass(BOSS_BASS[(bgmStep / 2) % BOSS_BASS.length], 0.24, 0.09);
          }
          if (bgmStep % 8 === 0) {
            playSpacePad([164.81, 233.08, 311.13, 415.30], 1.1, 0.025);
          }
        } else {
          playSpaceArp(SPACE_ARP[bgmStep % SPACE_ARP.length], 0.24, 0.042);
          if (bgmStep % 2 === 0) {
            playSubBass(SPACE_BASS[(bgmStep / 2) % SPACE_BASS.length], 0.26, 0.075);
          }
          if (bgmStep % 8 === 0) {
            const chord = SPACE_PAD_CHORDS[Math.floor(bgmStep / 8) % SPACE_PAD_CHORDS.length];
            playSpacePad(chord, 1.35, 0.024);
          }
        }
        bgmStep++;
      }, 150);
    }

    function getAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
      }
      if (audioCtx.state === "suspended") audioCtx.resume();
      startBgmLoop();
      return audioCtx;
    }

    function playTone(freq, type = "sawtooth", duration = 0.09, delay = 0, vol = 0.12, slideTo = null) {
      if (!soundEnabled) return;
      const ctx = getAudio();
      const t0 = ctx.currentTime + delay;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t0);
      if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + duration);
      gain.gain.setValueAtTime(vol, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t0);
      osc.stop(t0 + duration);
    }

    const sfx = {
      laser()     { playTone(980, "sine", 0.08, 0, 0.08, 240); },
      bossLaser() { playTone(420, "sawtooth", 0.16, 0, 0.11, 110); },
      hit()       { playTone(560, "triangle", 0.05, 0, 0.11, 320); },
      explode()   { playTone(150, "sawtooth", 0.25, 0, 0.18, 38); },
      damage()    { playTone(240, "sawtooth", 0.32, 0, 0.22, 50); },
      win()       { [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => playSpaceArp(f, 0.45, 0.08)); }
    };

    document.getElementById("soundBtn").addEventListener("click", e => {
      soundEnabled = !soundEnabled;
      if (soundEnabled) getAudio();
      e.target.textContent = soundEnabled ? "🔊 Music & SFX: ON" : "🔇 Music & SFX: OFF";
    });

    // Exact 9 interior rows of the "Map" block from shoot.md
    const RAW_STAGE_MAP = [
      "                       earthearthearthearthearthearthearthearthearthearthearthearthearthearthearthearthearthearthea ",
      "            X                     eart            C                          x   earchearchearch                    ",
      "               X               C  eart    X                        xx     x           C                             ",
      "                                  eart                                                    x                 bossbos ",
      "                   X                                X X X          C    C                                     bossbos ",
      "                                                                  earthearth      x       x                 bossbos ",
      "                                          X                  earthearthearthear                                     ",
      "                                  C               C          earthearthearthear       C   x                         ",
      "             eartheartheartheartheartheartheartheartheartheareartheartheartheararthearthearthearthearthearthearthea "
    ];

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const miniCanvas = document.getElementById("minimap");
    const miniCtx = miniCanvas.getContext("2d");

    const MAP_ROWS = RAW_STAGE_MAP.length; // 9 rows
    const MAP_COLS = Math.max(...RAW_STAGE_MAP.map(r => r.length)); // 118 cols
    const TILE_W = 36;
    const TILE_H = canvas.height / MAP_ROWS; // 50px per row
    const WORLD_W = MAP_COLS * TILE_W;

    let terrain = [];
    let enemies = [];
    let cannons = [];
    let bullets = [];
    let enemyBullets = [];
    let particles = [];
    let boss = null;
    let keys = {};
    let cameraX = 0;
    let score = 0;
    let gameOver = false;
    let victory = false;
    let stars = Array.from({ length: 70 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      s: 1 + Math.random() * 1.5
    }));

    let jet = {
      x: 90,
      y: canvas.height / 2,
      w: 54,
      h: 26,
      lives: 3,
      invuln: 0,
      fireCooldown: 0
    };

    function parseStageMap() {
      terrain = Array.from({ length: MAP_ROWS }, () => Array(MAP_COLS).fill(false));
      enemies = [];
      cannons = [];
      bullets = [];
      enemyBullets = [];
      particles = [];
      boss = null;
      cameraX = 0;
      score = 0;
      gameOver = false;
      victory = false;

      let bossCells = [];

      for (let r = 0; r < MAP_ROWS; r++) {
        const line = RAW_STAGE_MAP[r];
        for (let c = 0; c < line.length; c++) {
          const ch = line[c];
          if (/[earthc]/.test(ch)) {
            terrain[r][c] = true;
          } else if (ch === "X" || ch === "x") {
            // Merge adjacent 'xx' into a single enemy or wave
            if (c > 0 && (line[c - 1] === "x" || line[c - 1] === "X")) continue;
            enemies.push({
              x: c * TILE_W,
              y: r * TILE_H + TILE_H / 2,
              baseY: r * TILE_H + TILE_H / 2,
              w: 44,
              h: 28,
              hp: 1,
              type: ch,
              phase: Math.random() * Math.PI * 2,
              shootTimer: 110 + Math.floor(Math.random() * 90),
              alive: true
            });
          } else if (ch === "C") {
            const onCeiling = r <= 3;
            cannons.push({
              x: c * TILE_W,
              y: r * TILE_H + (onCeiling ? 14 : TILE_H - 14),
              w: 38,
              h: 26,
              hp: 2,
              onCeiling,
              shootTimer: 130 + Math.floor(Math.random() * 80),
              alive: true
            });
          } else if (/[bos]/.test(ch)) {
            bossCells.push({ r, c });
          }
        }
      }

      if (bossCells.length) {
        const minC = Math.min(...bossCells.map(b => b.c));
        const minR = Math.min(...bossCells.map(b => b.r));
        const maxR = Math.max(...bossCells.map(b => b.r));
        const baseX = minC * TILE_W + 40;
        boss = {
          x: baseX,
          baseX,
          y: ((minR + maxR + 1) / 2) * TILE_H,
          w: 110,
          h: 150,
          hp: 130,
          maxHp: 130,
          vy: 1.9,
          phaseTimer: 0,
          attackCycle: 0,
          shootTimer: 55,
          alive: true
        };
      }

      jet.x = 90;
      jet.y = canvas.height / 2;
      jet.lives = 3;
      jet.invuln = 90;
    }

    function spawnExplosion(x, y, color, count = 14) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1 + Math.random() * 4;
        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 20 + Math.random() * 15,
          color
        });
      }
    }

    function damageJet() {
      if (jet.invuln > 0 || gameOver || victory) return;
      jet.lives--;
      jet.invuln = 120;
      sfx.damage();
      spawnExplosion(jet.x, jet.y, "#38bdf8", 22);
      if (jet.lives <= 0) {
        gameOver = true;
      }
    }

    function rectOverlap(ax, ay, aw, ah, bx, by, bw, bh) {
      return Math.abs(ax - bx) * 2 < (aw + bw) && Math.abs(ay - by) * 2 < (ah + bh);
    }

    function collidesWithTerrain(screenX, screenY, w, h) {
      const worldX = cameraX + screenX;
      const startCol = Math.max(0, Math.floor((worldX - w / 2) / TILE_W));
      const endCol = Math.min(MAP_COLS - 1, Math.floor((worldX + w / 2) / TILE_W));
      const startRow = Math.max(0, Math.floor((screenY - h / 2) / TILE_H));
      const endRow = Math.min(MAP_ROWS - 1, Math.floor((screenY + h / 2) / TILE_H));

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          if (terrain[r][c]) {
            const tx = c * TILE_W - cameraX + TILE_W / 2;
            const ty = r * TILE_H + TILE_H / 2;
            if (rectOverlap(screenX, screenY, w, h, tx, ty, TILE_W, TILE_H)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function update() {
      if (gameOver || victory) return;

      // Scroll camera until reaching the Boss arena at the right end
      const maxCameraX = WORLD_W - canvas.width;
      if (cameraX < maxCameraX) {
        cameraX = Math.min(maxCameraX, cameraX + 1.4);
        document.getElementById("stageStatus").textContent =
          `Scrolling Cavern (${Math.floor((cameraX / maxCameraX) * 100)}%)`;
      } else {
        const enraged = boss && boss.hp <= boss.maxHp * 0.5;
        document.getElementById("stageStatus").textContent =
          enraged ? "🔥 BOSS OVERDRIVE (PHASE 2)!" : "⚠️ BOSS ENGAGED!";
      }

      // Move JET with solid axis-separated wall collision (cannot pass through earth walls)
      const speed = 4.6;
      let dx = 0;
      let dy = 0;
      if (keys["arrowup"] || keys["w"]) dy -= speed;
      if (keys["arrowdown"] || keys["s"]) dy += speed;
      if (keys["arrowleft"] || keys["a"]) dx -= speed;
      if (keys["arrowright"] || keys["d"]) dx += speed;

      const nextX = Math.max(40, Math.min(canvas.width - 60, jet.x + dx));
      if (!collidesWithTerrain(nextX, jet.y, 48, 22)) {
        jet.x = nextX;
      }

      const nextY = Math.max(24, Math.min(canvas.height - 24, jet.y + dy));
      if (!collidesWithTerrain(jet.x, nextY, 48, 22)) {
        jet.y = nextY;
      }

      // If scrolling terrain pushes into JET from the right, push JET left or slide vertically to open space
      if (collidesWithTerrain(jet.x, jet.y, 48, 22)) {
        if (!collidesWithTerrain(jet.x - 2, jet.y, 48, 22) && jet.x > 40) {
          jet.x -= 2;
        } else {
          // Find nearest open vertical gap at jet.x and damage jet
          damageJet();
          for (let offset = 4; offset < canvas.height; offset += 4) {
            if (jet.y + offset < canvas.height - 24 && !collidesWithTerrain(jet.x, jet.y + offset, 48, 22)) {
              jet.y += offset;
              break;
            }
            if (jet.y - offset > 24 && !collidesWithTerrain(jet.x, jet.y - offset, 48, 22)) {
              jet.y -= offset;
              break;
            }
          }
        }
      }

      if (jet.invuln > 0) jet.invuln--;
      if (jet.fireCooldown > 0) jet.fireCooldown--;

      // Shoot twin lasers (Space / Z / Enter)
      if ((keys[" "] || keys["z"] || keys["enter"]) && jet.fireCooldown === 0) {
        bullets.push({ x: jet.x + 30, y: jet.y - 5, vx: 11, vy: 0 });
        bullets.push({ x: jet.x + 30, y: jet.y + 9, vx: 11, vy: 0 });
        jet.fireCooldown = 8;
        sfx.laser();
      }

      // Update player bullets
      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.x += b.vx;
        b.y += b.vy;
        if (b.x > canvas.width + 20) {
          bullets.splice(i, 1);
          continue;
        }

        // Player bullets can shoot down normal enemy projectiles, but NOT indestructible Boss plasma orbs!
        let intercepted = false;
        for (let j = enemyBullets.length - 1; j >= 0; j--) {
          const eb = enemyBullets[j];
          const hitSize = (eb.r || 5) * 2 + 2;
          if (rectOverlap(b.x, b.y, 16, 10, eb.x, eb.y, hitSize, hitSize)) {
            if (eb.indestructible) {
              // Plasma orb absorbs player laser! Must dodge!
              spawnExplosion(b.x, b.y, "#38bdf8", 2);
              bullets.splice(i, 1);
              intercepted = true;
              break;
            } else {
              sfx.hit();
              spawnExplosion(eb.x, eb.y, "#fde047", 4);
              enemyBullets.splice(j, 1);
              bullets.splice(i, 1);
              intercepted = true;
              break;
            }
          }
        }
        if (intercepted) continue;

        // Hit terrain?
        const wc = Math.floor((cameraX + b.x) / TILE_W);
        const wr = Math.floor(b.y / TILE_H);
        if (wr >= 0 && wr < MAP_ROWS && wc >= 0 && wc < MAP_COLS && terrain[wr][wc]) {
          spawnExplosion(b.x, b.y, "#f59e0b", 4);
          bullets.splice(i, 1);
          continue;
        }

        // Hit flying enemies
        let removed = false;
        for (const e of enemies) {
          if (!e.alive) continue;
          const sx = e.x - cameraX;
          if (rectOverlap(b.x, b.y, 14, 8, sx, e.y, e.w, e.h)) {
            e.hp--;
            spawnExplosion(b.x, b.y, "#f43f5e", 6);
            if (e.hp <= 0) {
              e.alive = false;
              score += 150;
              sfx.explode();
              spawnExplosion(sx, e.y, "#f43f5e", 16);
            } else {
              sfx.hit();
            }
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
        if (removed) continue;

        // Hit cannons
        for (const c of cannons) {
          if (!c.alive) continue;
          const sx = c.x - cameraX;
          if (rectOverlap(b.x, b.y, 14, 8, sx, c.y, c.w, c.h)) {
            c.hp--;
            spawnExplosion(b.x, b.y, "#f59e0b", 6);
            if (c.hp <= 0) {
              c.alive = false;
              score += 200;
              sfx.explode();
              spawnExplosion(sx, c.y, "#f59e0b", 16);
            } else {
              sfx.hit();
            }
            bullets.splice(i, 1);
            removed = true;
            break;
          }
        }
        if (removed) continue;

        // Hit Boss
        if (boss && boss.alive) {
          const bx = boss.x - cameraX;
          if (bx < canvas.width + 60 && rectOverlap(b.x, b.y, 14, 8, bx, boss.y, boss.w, boss.h)) {
            boss.hp--;
            score += 25;
            spawnExplosion(b.x, b.y, "#c084fc", 7);
            bullets.splice(i, 1);
            if (boss.hp <= 0) {
              boss.alive = false;
              score += 3000;
              sfx.win();
              spawnExplosion(bx, boss.y, "#c084fc", 55);
              victory = true;
            } else {
              sfx.hit();
            }
          }
        }
      }

      // Update active flying enemies (cannot pass through terrain walls either)
      for (const e of enemies) {
        if (!e.alive) continue;
        const sx = e.x - cameraX;
        if (sx < -60 || sx > canvas.width + 80) continue;

        const moveSpeed = e.fast ? 2.4 : 0.5;
        const nextEx = e.x - moveSpeed;
        if (!collidesWithTerrain(nextEx - cameraX, e.y, e.w, e.h)) {
          e.x = nextEx;
        }
        e.phase += e.fast ? 0.08 : 0.04;
        const nextEy = e.baseY + Math.sin(e.phase) * (e.fast ? 28 : 16);
        if (!collidesWithTerrain(e.x - cameraX, nextEy, e.w, e.h)) {
          e.y = nextEy;
        }

        if (rectOverlap(jet.x, jet.y, 26, 14, sx, e.y, e.w, e.h)) {
          e.alive = false;
          spawnExplosion(sx, e.y, "#f43f5e", 14);
          damageJet();
          continue;
        }

        e.shootTimer--;
        if (e.shootTimer <= 0) {
          e.shootTimer = e.fast ? 95 : 150;
          enemyBullets.push({ x: sx - 20, y: e.y, vx: -3.0, vy: 0, color: "#fb7185", r: 5 });
        }
      }

      // Update active ground/ceiling cannons
      for (const c of cannons) {
        if (!c.alive) continue;
        const sx = c.x - cameraX;
        if (sx < -50 || sx > canvas.width + 50) continue;

        if (rectOverlap(jet.x, jet.y, 26, 14, sx, c.y, c.w, c.h)) {
          damageJet();
        }

        c.shootTimer--;
        if (c.shootTimer <= 0) {
          c.shootTimer = 170;
          const angle = Math.atan2(jet.y - c.y, jet.x - sx);
          enemyBullets.push({
            x: sx,
            y: c.y,
            vx: Math.cos(angle) * 2.4,
            vy: Math.sin(angle) * 2.4,
            color: "#fbbf24",
            r: 5
          });
        }
      }

      // Update Boss (Multi-Phase AI & 3 Attack Patterns)
      if (boss && boss.alive) {
        const bx = boss.x - cameraX;
        if (bx < canvas.width + 80) {
          const enraged = boss.hp <= boss.maxHp * 0.5;
          boss.phaseTimer += enraged ? 0.055 : 0.035;

          // Horizontal figure-8 / thruster weaving + vertical sweep
          boss.x = boss.baseX - Math.sin(boss.phaseTimer) * (enraged ? 85 : 48);
          boss.y += boss.vy * (enraged ? 1.55 : 1.0);
          if (boss.y < 110) {
            boss.y = 110;
            boss.vy = Math.abs(boss.vy);
          } else if (boss.y > canvas.height - 110) {
            boss.y = canvas.height - 110;
            boss.vy = -Math.abs(boss.vy);
          }

          const curBx = boss.x - cameraX;
          if (rectOverlap(jet.x, jet.y, 26, 14, curBx, boss.y, boss.w, boss.h)) {
            damageJet();
          }

          boss.shootTimer--;
          if (boss.shootTimer <= 0) {
            boss.shootTimer = enraged ? 38 : 56;
            const pattern = boss.attackCycle % 3;
            boss.attackCycle++;
            sfx.bossLaser();

            if (pattern === 0) {
              // Pattern 0: Aimed Indestructible Heavy Plasma Orbs (Must dodge!)
              const angles = enraged ? [-0.28, -0.1, 0.1, 0.28] : [-0.22, 0, 0.22];
              const baseAngle = Math.atan2(jet.y - boss.y, jet.x - curBx);
              for (const offset of angles) {
                const a = baseAngle + offset;
                const spd = enraged ? 4.3 : 3.6;
                enemyBullets.push({
                  x: curBx - 55,
                  y: boss.y,
                  vx: Math.cos(a) * spd,
                  vy: Math.sin(a) * spd,
                  color: "#22d3ee",
                  r: 8,
                  indestructible: true
                });
              }
            } else if (pattern === 1) {
              // Pattern 1: Wide 5-Way / 7-Way Fan Curtain from Top & Bottom Turrets
              const count = enraged ? 7 : 5;
              for (let k = 0; k < count; k++) {
                const spread = ((k / (count - 1)) - 0.5) * 1.15;
                const a = Math.PI + spread;
                const spd = enraged ? 3.8 : 3.1;
                enemyBullets.push({
                  x: curBx - 50,
                  y: boss.y + (k % 2 === 0 ? -38 : 38),
                  vx: Math.cos(a) * spd,
                  vy: Math.sin(a) * spd,
                  color: "#e879f9",
                  r: 6
                });
              }
            } else {
              // Pattern 2: Twin Indestructible Laser Cannons + Interceptor Drone Launch
              for (const yOff of [-48, 48]) {
                enemyBullets.push({
                  x: curBx - 55,
                  y: boss.y + yOff,
                  vx: enraged ? -5.2 : -4.4,
                  vy: 0,
                  color: "#f43f5e",
                  r: 8,
                  indestructible: true
                });
              }
              // Deploy an aggressive interceptor fighter if fewer than 3 active nearby
              const activeNearby = enemies.filter(e => e.alive && Math.abs((e.x - cameraX) - curBx) < 500).length;
              if (activeNearby < (enraged ? 3 : 2)) {
                enemies.push({
                  x: boss.x - 60,
                  y: boss.y,
                  baseY: boss.y,
                  w: 44,
                  h: 28,
                  hp: 2,
                  type: "X",
                  fast: true,
                  phase: Math.random() * Math.PI * 2,
                  shootTimer: 45,
                  alive: true
                });
              }
            }
          }
        }
      }

      // Update enemy bullets (also blocked by earth walls!)
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;
        if (eb.x < -20 || eb.x > canvas.width + 20 || eb.y < -20 || eb.y > canvas.height + 20) {
          enemyBullets.splice(i, 1);
          continue;
        }
        // Enemy bullets hit earth walls and stop
        const wc = Math.floor((cameraX + eb.x) / TILE_W);
        const wr = Math.floor(eb.y / TILE_H);
        if (wr >= 0 && wr < MAP_ROWS && wc >= 0 && wc < MAP_COLS && terrain[wr][wc]) {
          spawnExplosion(eb.x, eb.y, eb.color, 3);
          enemyBullets.splice(i, 1);
          continue;
        }
        const hitR = eb.r || 5;
        if (rectOverlap(jet.x, jet.y, 22, 12, eb.x, eb.y, hitR * 1.6, hitR * 1.6)) {
          enemyBullets.splice(i, 1);
          damageJet();
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }

      document.getElementById("scoreEl").textContent = score;
    }

    // Draw the player's JET matching the ASCII box art in shoot.md
    function drawJet(x, y) {
      if (jet.invuln > 0 && Math.floor(jet.invuln / 4) % 2 === 1) return;
      ctx.save();
      ctx.translate(x, y);

      // Thruster flame
      ctx.fillStyle = "#f97316";
      ctx.fillRect(-36 - Math.random() * 8, -2, 14, 4);

      // Tail fin ┌─┐
      ctx.fillStyle = "#0284c7";
      ctx.strokeStyle = "#e0f2fe";
      ctx.lineWidth = 2;
      ctx.fillRect(-22, -16, 12, 10);
      ctx.strokeRect(-22, -16, 12, 10);

      // Main fuselage └──────┐ / └────────┘
      ctx.fillStyle = "#0ea5e9";
      ctx.fillRect(-22, -6, 42, 16);
      ctx.strokeRect(-22, -6, 42, 16);

      // Nose cone "JET"
      ctx.fillStyle = "#38bdf8";
      ctx.beginPath();
      ctx.moveTo(20, -6);
      ctx.lineTo(34, 2);
      ctx.lineTo(20, 10);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = "#fff";
      ctx.font = "bold 11px monospace";
      ctx.fillText("JET", -10, 5);
      ctx.restore();
    }

    function drawBoxEntity(x, y, w, h, label, borderColor, fillColor) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = fillColor;
      ctx.strokeStyle = borderColor;
      ctx.lineWidth = 2;
      ctx.fillRect(-w / 2, -h / 2, w, h);
      ctx.strokeRect(-w / 2, -h / 2, w, h);

      ctx.fillStyle = borderColor;
      ctx.font = "bold 12px monospace";
      ctx.textAlign = "center";
      ctx.fillText(label, 0, -h / 2 - 5);
      ctx.restore();
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Stars background
      ctx.fillStyle = "rgba(255,255,255,0.45)";
      for (const s of stars) {
        const sx = (s.x - cameraX * 0.25 % canvas.width + canvas.width) % canvas.width;
        ctx.fillRect(sx, s.y, s.s, s.s);
      }

      // Draw scrolling "earth" terrain
      const startCol = Math.max(0, Math.floor(cameraX / TILE_W));
      const endCol = Math.min(MAP_COLS - 1, Math.ceil((cameraX + canvas.width) / TILE_W));
      for (let r = 0; r < MAP_ROWS; r++) {
        for (let c = startCol; c <= endCol; c++) {
          if (terrain[r][c]) {
            const sx = c * TILE_W - cameraX;
            const sy = r * TILE_H;
            ctx.fillStyle = "#451a03";
            ctx.fillRect(sx, sy, TILE_W + 1, TILE_H);
            ctx.strokeStyle = "#78350f";
            ctx.strokeRect(sx, sy, TILE_W, TILE_H);
            ctx.fillStyle = "#a16207";
            ctx.font = "11px monospace";
            ctx.fillText("earth", sx + 2, sy + TILE_H / 2 + 4);
          }
        }
      }

      // Draw enemies (`enemy` box from Main screen)
      for (const e of enemies) {
        if (!e.alive) continue;
        const sx = e.x - cameraX;
        if (sx < -60 || sx > canvas.width + 60) continue;
        drawBoxEntity(sx, e.y, e.w, e.h, "enemy", "#fb7185", "rgba(159, 18, 57, 0.75)");
      }

      // Draw cannons (`canon` box from Main screen)
      for (const c of cannons) {
        if (!c.alive) continue;
        const sx = c.x - cameraX;
        if (sx < -60 || sx > canvas.width + 60) continue;
        drawBoxEntity(sx, c.y, c.w, c.h, "canon", "#fbbf24", "rgba(146, 64, 14, 0.85)");
      }

      // Draw Boss (`bossbos` at end of Map)
      if (boss && boss.alive) {
        const bx = boss.x - cameraX;
        if (bx < canvas.width + 100) {
          const enraged = boss.hp <= boss.maxHp * 0.5;
          drawBoxEntity(
            bx,
            boss.y,
            boss.w,
            boss.h,
            enraged ? `🔥 BOSS OVERDRIVE (${boss.hp})` : `BOSS (${boss.hp})`,
            enraged ? "#f43f5e" : "#e879f9",
            enraged ? "rgba(136, 19, 55, 0.88)" : "rgba(88, 28, 135, 0.85)"
          );
          ctx.fillStyle = enraged ? "#fda4af" : "#f0abfc";
          ctx.font = "bold 16px monospace";
          ctx.textAlign = "center";
          ctx.fillText("bossbos", bx, boss.y - 20);
          ctx.fillText("bossbos", bx, boss.y + 4);
          ctx.fillText("bossbos", bx, boss.y + 28);
        }
      }

      // Draw JET
      drawJet(jet.x, jet.y);

      // Draw player bullets
      ctx.fillStyle = "#38bdf8";
      for (const b of bullets) {
        ctx.fillRect(b.x - 8, b.y - 2, 16, 4);
      }

      // Draw enemy bullets (with glowing outer ring for indestructible Boss plasma orbs)
      for (const eb of enemyBullets) {
        const r = eb.r || 5;
        if (eb.indestructible) {
          ctx.save();
          ctx.strokeStyle = "#fff";
          ctx.lineWidth = 2;
          ctx.fillStyle = eb.color;
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, r, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          ctx.restore();
        } else {
          ctx.fillStyle = eb.color;
          ctx.beginPath();
          ctx.arc(eb.x, eb.y, r, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      // Draw particles
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
      }

      // Top-left HUD: "Life ※ ※ ※" matching Main screen
      ctx.fillStyle = "rgba(9, 13, 22, 0.78)";
      ctx.fillRect(12, 10, 175, 30);
      ctx.fillStyle = "#fde047";
      ctx.font = "bold 16px monospace";
      ctx.textAlign = "left";
      const lifeSymbols = Array.from({ length: Math.max(0, jet.lives) }, () => "※").join(" ");
      ctx.fillText(`Life ${lifeSymbols}`, 20, 30);

      // Top-center BOSS HP Bar when Boss is on screen
      if (boss && boss.alive && boss.x - cameraX < canvas.width + 60) {
        const barW = 320;
        const barH = 14;
        const barX = (canvas.width - barW) / 2;
        const barY = 16;
        ctx.fillStyle = "rgba(9, 13, 22, 0.85)";
        ctx.fillRect(barX - 4, barY - 4, barW + 8, barH + 8);
        ctx.strokeStyle = "#a855f7";
        ctx.strokeRect(barX - 4, barY - 4, barW + 8, barH + 8);
        const ratio = Math.max(0, boss.hp / boss.maxHp);
        ctx.fillStyle = ratio <= 0.5 ? "#f43f5e" : "#c084fc";
        ctx.fillRect(barX, barY, barW * ratio, barH);
      }

      // Overlay for Game Over / Victory
      if (gameOver || victory) {
        ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = victory ? "#4ade80" : "#f87171";
        ctx.font = "bold 34px monospace";
        ctx.textAlign = "center";
        ctx.fillText(victory ? "STAGE CLEAR! BOSS DEFEATED!" : "GAME OVER", canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = "#e4e4e7";
        ctx.font = "16px monospace";
        ctx.fillText("Press R or click Restart to play again", canvas.width / 2, canvas.height / 2 + 28);
      }

      renderMinimap();
    }

    function renderMinimap() {
      miniCtx.clearRect(0, 0, miniCanvas.width, miniCanvas.height);
      const cw = miniCanvas.width / MAP_COLS;
      const ch = miniCanvas.height / MAP_ROWS;

      for (let r = 0; r < MAP_ROWS; r++) {
        for (let c = 0; c < MAP_COLS; c++) {
          if (terrain[r][c]) {
            miniCtx.fillStyle = "#78350f";
            miniCtx.fillRect(c * cw, r * ch, cw + 0.5, ch + 0.5);
          }
        }
      }

      for (const e of enemies) {
        if (!e.alive) continue;
        miniCtx.fillStyle = "#f43f5e";
        miniCtx.fillRect((e.x / WORLD_W) * miniCanvas.width, (e.y / canvas.height) * miniCanvas.height, 4, 4);
      }

      for (const c of cannons) {
        if (!c.alive) continue;
        miniCtx.fillStyle = "#fbbf24";
        miniCtx.fillRect((c.x / WORLD_W) * miniCanvas.width, (c.y / canvas.height) * miniCanvas.height, 4, 4);
      }

      if (boss && boss.alive) {
        miniCtx.fillStyle = "#c084fc";
        miniCtx.fillRect((boss.x / WORLD_W) * miniCanvas.width - 4, 3 * ch, 10, 3 * ch);
      }

      // Current viewport window rectangle on minimap
      const vx = (cameraX / WORLD_W) * miniCanvas.width;
      const vw = (canvas.width / WORLD_W) * miniCanvas.width;
      miniCtx.strokeStyle = "#38bdf8";
      miniCtx.lineWidth = 1.5;
      miniCtx.strokeRect(vx, 1, vw, miniCanvas.height - 2);
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", e => {
      getAudio();
      const k = e.key.toLowerCase();
      keys[k] = true;
      if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].includes(k)) {
        e.preventDefault();
      }
      if (k === "r") parseStageMap();
    });

    window.addEventListener("pointerdown", () => {
      getAudio();
    });

    window.addEventListener("keyup", e => {
      keys[e.key.toLowerCase()] = false;
    });

    document.getElementById("restartBtn").addEventListener("click", parseStageMap);

    parseStageMap();
    getAudio();
    loop();
  </script>
</body>
</html>
