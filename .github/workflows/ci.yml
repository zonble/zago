name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Swift Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Swift Toolchain (Linux & Windows)
        if: runner.os != 'macOS'
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"

      - name: Install System Dictionary (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wamerican

      - name: Display Swift Version
        run: swift --version

      - name: Build Package (Debug)
        run: swift build

      - name: Run Automated Tests & Code Coverage
        run: swift test --enable-code-coverage

      - name: Build Package (Release)
        run: swift build -c release

      - name: Create Windows Release Archive
        if: runner.os == 'Windows'
        run: Compress-Archive -Path .build\release\zago.exe -DestinationPath zago-windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zago-${{ matrix.os }}
          path: |
            .build/release/zago
            .build/release/zago.exe
            .build/*/release/zago
            .build/*/release/zago.exe
            zago-windows-x64.zip
          if-no-files-found: warn
