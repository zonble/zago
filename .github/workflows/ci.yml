name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Swift Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Swift Toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          winget source update
          winget install --id Swift.Toolchain --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity

          $swiftBin = Get-ChildItem -Path `
            "$env:LOCALAPPDATA\Programs\Swift\Toolchains\*\usr\bin", `
            "$env:ProgramFiles\Swift\Toolchains\*\usr\bin" `
            -Directory -ErrorAction SilentlyContinue |
            Select-Object -First 1

          if (-not $swiftBin) {
            throw "Swift toolchain was installed by winget, but no Swift usr\bin directory was found."
          }

          $swiftBin.FullName | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install System Dictionary (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y wamerican

      - name: Display Swift Version
        if: runner.os != 'Windows'
        run: swift --version

      - name: Display Swift Version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pathValue = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if (-not $pathValue) {
            $pathValue = [Environment]::GetEnvironmentVariable('PATH', 'Process')
          }
          Remove-Item Env:PATH -ErrorAction SilentlyContinue
          Remove-Item Env:Path -ErrorAction SilentlyContinue
          $env:Path = $pathValue
          swift --version

      - name: Build Package (Debug)
        if: runner.os != 'Windows'
        run: swift build

      - name: Build Package (Debug, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pathValue = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if (-not $pathValue) {
            $pathValue = [Environment]::GetEnvironmentVariable('PATH', 'Process')
          }
          Remove-Item Env:PATH -ErrorAction SilentlyContinue
          Remove-Item Env:Path -ErrorAction SilentlyContinue
          $env:Path = $pathValue
          swift build

      - name: Run Automated Tests & Code Coverage
        if: runner.os != 'Windows'
        run: swift test --enable-code-coverage

      - name: Run Automated Tests & Code Coverage (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pathValue = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if (-not $pathValue) {
            $pathValue = [Environment]::GetEnvironmentVariable('PATH', 'Process')
          }
          Remove-Item Env:PATH -ErrorAction SilentlyContinue
          Remove-Item Env:Path -ErrorAction SilentlyContinue
          $env:Path = $pathValue
          swift test --enable-code-coverage

      - name: Build Package (Release)
        if: runner.os != 'Windows'
        run: swift build -c release

      - name: Build Package (Release, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pathValue = [Environment]::GetEnvironmentVariable('Path', 'Process')
          if (-not $pathValue) {
            $pathValue = [Environment]::GetEnvironmentVariable('PATH', 'Process')
          }
          Remove-Item Env:PATH -ErrorAction SilentlyContinue
          Remove-Item Env:Path -ErrorAction SilentlyContinue
          $env:Path = $pathValue
          swift build -c release

      - name: Create Windows Release Archive
        if: runner.os == 'Windows'
        run: Compress-Archive -Path .build\release\zago.exe -DestinationPath zago-windows-x64.zip -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zago-${{ matrix.os }}
          path: |
            .build/release/zago
            .build/release/zago.exe
            .build/*/release/zago
            .build/*/release/zago.exe
            zago-windows-x64.zip
          if-no-files-found: warn
